name: Validate release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""
      - name: Validate scripts and theme payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $psFiles = @((Resolve-Path -LiteralPath 'install.ps1').Path) + (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File | ForEach-Object { $_.FullName })
          foreach ($file in $psFiles) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse error in $file" }
          }
          Get-Content -LiteralPath 'assets\theme.json' -Raw -Encoding utf8 | ConvertFrom-Json | Out-Null
          node --check .\scripts\injector.mjs
          node --check .\assets\renderer-inject.js
          node .\scripts\injector.mjs --self-test --theme-dir .\assets
      - name: Build release archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'codex-theme-release'
          .\scripts\build-release.ps1 -Version v0.0.0-ci.0 -OutputDirectory $output
          if (-not (Test-Path -LiteralPath (Join-Path $output 'CodexThemeLauncher-v0.0.0-ci.0.zip'))) { throw 'Release archive was not created.' }
